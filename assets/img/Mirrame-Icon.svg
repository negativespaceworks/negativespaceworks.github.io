<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <!-- Master for Mirrame app icon. Rasterize via Design/render_app_icon.swift -->
  <defs>
    <filter id="iconShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1c30" flood-opacity="0.30"/>
    </filter>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0c0a09" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="field" cx="627" cy="627" r="615" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d6a96"/>
      <stop offset="1" stop-color="#55507a"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="12" y="12" width="1230" height="1230" rx="274" ry="274"/>
    </clipPath>
  </defs>

  <rect x="12" y="12" width="1230" height="1230" rx="274" fill="#55507a" filter="url(#iconShadow)"/>

  <g clip-path="url(#squircle)">
    <rect x="12" y="12" width="1230" height="1230" fill="url(#field)"/>

    <!-- Three simple windows in a row. Small gaps so the field shows through the frame. -->
    <g filter="url(#winShadow)">
      <rect x="120" y="568" width="360" height="248" rx="36" fill="#0c0a09"/>
    </g>
    <rect x="120" y="568" width="360" height="248" rx="36" fill="none" stroke="#7a76a0" stroke-width="7"/>
    <circle cx="174" cy="622" r="13" fill="#7a76a0"/>
    <circle cx="214" cy="622" r="13" fill="#7a76a0"/>
    <circle cx="254" cy="622" r="13" fill="#7a76a0"/>

    <g filter="url(#winShadow)">
      <rect x="373" y="268" width="509" height="351" rx="36" fill="#0c0a09"/>
    </g>
    <rect x="373" y="268" width="509" height="351" rx="36" fill="none" stroke="#8e8ab4" stroke-width="7"/>
    <circle cx="427" cy="322" r="13" fill="#8e8ab4"/>
    <circle cx="467" cy="322" r="13" fill="#8e8ab4"/>
    <circle cx="507" cy="322" r="13" fill="#8e8ab4"/>

    <g filter="url(#winShadow)">
      <rect x="774" y="716" width="360" height="248" rx="36" fill="#0c0a09"/>
    </g>
    <rect x="774" y="716" width="360" height="248" rx="36" fill="none" stroke="#7a76a0" stroke-width="7"/>
    <circle cx="828" cy="770" r="13" fill="#7a76a0"/>
    <circle cx="868" cy="770" r="13" fill="#7a76a0"/>
    <circle cx="908" cy="770" r="13" fill="#7a76a0"/>

    <!-- Mirrame frame: dashed, no fill. Field and windows show through. -->
    <rect x="247" y="360" width="760" height="520" rx="52"
          fill="none" stroke="#c4c0e0" stroke-width="10"
          stroke-dasharray="24 15" stroke-linecap="round"/>
  </g>
</svg>
